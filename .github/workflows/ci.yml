name: CI

on:
  push:
    branches: [main, agent-production-v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-and-diagnostics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest sqlglot==30.20.0 sqlparse==0.6.0

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run diagnostic and offline safety replay tests
        run: python -m pytest -q tests/test_diagnostics.py tests/test_safety_replay.py

